name: Autofix

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  autofix:
    # Fork/Dependabot PR tokens cannot write back to the source branch.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || github.ref_type == 'branch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      AUTOFIX_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Use the real branch rather than the synthetic PR merge commit.
          ref: ${{ env.AUTOFIX_BRANCH }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev liblzma-dev
      - name: Apply automatic fixes
        run: |
          cargo clippy --locked --all-targets --all-features --fix --allow-dirty
          cargo fmt --all
      - name: Test fixes
        run: cargo test --locked --all-features
      - name: Commit and push fixes
        id: commit
        run: |
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply rustfmt and Clippy fixes'
          git push origin "HEAD:refs/heads/$AUTOFIX_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Check the updated commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch checks
        # explicitly, without starting another packaging/publication run.
        run: gh workflow run ci.yml --ref "$AUTOFIX_BRANCH" -f checks_only=true
      - name: Check remaining lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
