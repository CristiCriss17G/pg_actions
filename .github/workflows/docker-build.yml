name: Docker Build

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      rust_version:
        required: true
        type: string
      alpine_version:
        required: true
        type: string
      image:
        required: true
        type: string
      major_tag:
        required: true
        type: string
      minor_tag:
        required: true
        type: string
      long_tag:
        required: true
        type: string
      short_tag:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  docker:
    name: PostgreSQL ${{ matrix.postgres_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres_version:
          - "16"
          - "17"
          - "18"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'dev')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' && matrix.postgres_version == '18' }}
            type=raw,value=${{ inputs.major_tag }},enable=${{ github.ref_name == 'main' && matrix.postgres_version == '18' }}
            type=raw,value=${{ inputs.minor_tag }},enable=${{ github.ref_name == 'main' && matrix.postgres_version == '18' }}
            type=raw,value=${{ inputs.long_tag }},enable=${{ matrix.postgres_version == '18' }}
            type=raw,value=${{ inputs.short_tag }},enable=${{ matrix.postgres_version == '18' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.ref_name == 'main' && matrix.postgres_version == '18' }}
            type=raw,value=dev-${{ inputs.major_tag }},enable=${{ github.ref_name == 'dev' && matrix.postgres_version == '18' }}
            type=raw,value=dev-${{ inputs.minor_tag }},enable=${{ github.ref_name == 'dev' && matrix.postgres_version == '18' }}
            type=raw,value=dev-${{ inputs.version }},enable=${{ github.ref_name == 'dev' && matrix.postgres_version == '18' }}
            type=raw,value=pg${{ matrix.postgres_version }},enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest-pg${{ matrix.postgres_version }},enable=${{ github.ref_name == 'main' }}
            type=raw,value=${{ inputs.major_tag }}-pg${{ matrix.postgres_version }},enable=${{ github.ref_name == 'main' }}
            type=raw,value=${{ inputs.minor_tag }}-pg${{ matrix.postgres_version }},enable=${{ github.ref_name == 'main' }}
            type=raw,value=${{ inputs.long_tag }}-pg${{ matrix.postgres_version }}
            type=raw,value=${{ inputs.short_tag }}-pg${{ matrix.postgres_version }}
            type=raw,value=${{ inputs.version }}-pg${{ matrix.postgres_version }},enable=${{ github.ref_name == 'main' }}
            type=raw,value=dev-pg${{ matrix.postgres_version }},enable=${{ github.ref_name == 'dev' }}
            type=raw,value=dev-${{ inputs.major_tag }}-pg${{ matrix.postgres_version }},enable=${{ github.ref_name == 'dev' }}
            type=raw,value=dev-${{ inputs.minor_tag }}-pg${{ matrix.postgres_version }},enable=${{ github.ref_name == 'dev' }}
            type=raw,value=dev-${{ inputs.version }}-pg${{ matrix.postgres_version }},enable=${{ github.ref_name == 'dev' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'dev') }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            APP_NAME=${{ inputs.app_name }}
            RUST_VERSION=${{ inputs.rust_version }}
            ALPINE_VERSION=${{ inputs.alpine_version }}
            POSTGRES_VERSION=${{ matrix.postgres_version }}

      - name: Attest
        if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'dev')
        uses: actions/attest@v4
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
