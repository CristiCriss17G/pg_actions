name: Standalone And Release

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      rust_version:
        required: true
        type: string
      alpine_version:
        required: true
        type: string
      version:
        required: true
        type: string
      latest_mr_desc:
        required: false
        type: string
        default: ""

jobs:
  compile_dynamic:
    name: Compile Dynamic
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name }}
      RUST_VERSION: ${{ inputs.rust_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld build-essential gpg sudo wget lsb-release ca-certificates
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Build
        shell: bash
        run: |
          cargo fetch --locked
          cargo build --locked --release --target-dir ./target
          cp "target/release/${APP_NAME}" "$APP_NAME"

      - name: Upload dynamic binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}
          path: ${{ env.APP_NAME }}
          retention-days: 7

  compile_static:
    name: Compile Static
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name }}
      RUST_VERSION: ${{ inputs.rust_version }}
      ALPINE_VERSION: ${{ inputs.alpine_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static binary
        shell: bash
        run: |
          docker run --rm \
            -e APP_NAME="$APP_NAME" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "rust:${RUST_VERSION}-alpine${ALPINE_VERSION}" \
            sh -c 'cargo --version && apk update && apk upgrade --no-cache && apk add --no-cache build-base clang lld musl-dev git file pkgconfig openssl-dev libcrypto3 libssl3 openssl-libs-static postgresql16-client && cargo fetch --locked && cargo build --locked --release --target-dir ./target && cp "target/release/${APP_NAME}" "${APP_NAME}-static"'

      - name: Upload static binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-static
          path: ${{ env.APP_NAME }}-static
          retention-days: 7

  make_deb_files:
    name: Debian Packages
    runs-on: ubuntu-latest
    needs:
      - compile_dynamic
      - compile_static
    env:
      APP_NAME: ${{ inputs.app_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download dynamic binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}
          path: .

      - name: Download static binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-static
          path: .

      - name: Install packaging dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts curl

      - name: Build Debian packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          sed -i "s/\(Version: \)[0-9]\+\.[0-9]\+\.[0-9]\+\(-static\.[0-9]\+\)/\1${RELEASE_VERSION}\2/" debian/static/DEBIAN/control
          sed -i "s/\(Version: \)[0-9]\+\.[0-9]\+\.[0-9]\+\(-[0-9]\+\)/\1${RELEASE_VERSION}\2/" debian/dynamic/DEBIAN/control
          cp "$APP_NAME" "debian/dynamic/usr/local/bin/$APP_NAME"
          rm -f debian/dynamic/usr/local/bin/.gitkeep
          cp "${APP_NAME}-static" "debian/static/usr/local/bin/${APP_NAME}"
          rm -f debian/static/usr/local/bin/.gitkeep
          install -Dm644 LICENSE debian/dynamic/usr/share/doc/pg-actions/LICENSE
          install -Dm644 LICENSE debian/static/usr/share/doc/pg-actions/LICENSE
          find debian -type d -exec chmod 755 {} +
          find debian -type f -exec chmod 644 {} +
          chmod 755 "debian/dynamic/usr/local/bin/$APP_NAME"
          chmod 755 "debian/static/usr/local/bin/$APP_NAME"
          dpkg-deb --build debian/dynamic "${APP_NAME}_${RELEASE_VERSION}_amd64.deb"
          dpkg-deb --build debian/static "${APP_NAME}-static_${RELEASE_VERSION}_amd64.deb"

      - name: Upload Debian packages
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages
          path: |
            ${{ env.APP_NAME }}_${{ inputs.version }}_amd64.deb
            ${{ env.APP_NAME }}-static_${{ inputs.version }}_amd64.deb
          retention-days: 7

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - compile_dynamic
      - compile_static
      - make_deb_files
    if: github.event_name == 'push' && github.ref_name == 'main'
    env:
      APP_NAME: ${{ inputs.app_name }}
    steps:
      - name: Download dynamic binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}
          path: dist

      - name: Download static binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-static
          path: dist

      - name: Download Debian packages
        uses: actions/download-artifact@v8
        with:
          name: debian-packages
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          LATEST_MR_DESC: ${{ inputs.latest_mr_desc }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"
          notes="Release created using GitHub Actions. Release '${tag}': ${LATEST_MR_DESC}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Release v${RELEASE_VERSION}" --notes "$notes"
          fi

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ./dist/*
