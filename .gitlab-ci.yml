stages:
  - checks
  - prepare-build
  - build
  - deb
  - release

variables:
  SERVICE_NAME: "tools/postgres-db-actions"
  HARBOR_PROJ: devops-services
  TIMESTAMP: ./timestamp.txt
  TAGS: ./tags.txt
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:debug
  DOCKER_CONFIG: /kaniko/.docker/
  APP_NAME: pg_actions

sonarqube-check:
  stage: checks
  image:
    name: sonarsource/sonar-scanner-cli:${SONAR_SCANNER_VERSION}
    entrypoint: [""]
  tags:
    - ivfhq
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
    GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_REF_NAME == "main"'

prepare:
  stage: prepare-build
  image:
    name: regcr.ivfuture.uk/gitlab-cicd/prepare:latest
    entrypoint: [""]
  tags:
    - ivfhq
  cache: {}
  before_script:
    - echo "Preparing ..."
    - export CI_PIPELINE_CREATED_AT=$(date +%d%m%Y%H%M)
    - export SHORT_TAG=$(echo $CI_COMMIT_REF_NAME | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')-latest
    - export LONG_TAG=$(echo $CI_COMMIT_REF_NAME | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_CREATED_AT
  script:
    - echo $CI_PIPELINE_CREATED_AT > $TIMESTAMP
    - if [ "$CI_COMMIT_REF_NAME" == "main" ]; then echo "latest" > $TAGS; fi
    - echo $LONG_TAG >> $TAGS
    - echo $SHORT_TAG >> $TAGS
  artifacts:
    paths:
      - $TIMESTAMP
      - $TAGS
  only:
    - branches
    - merge_requests

build:
  stage: build
  dependencies:
    - prepare
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  tags:
    - ivfhq
  interruptible: true
  cache: {}
  before_script:
    - echo "Building ..."
    - path=$(pwd)
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${HARBOR_REPO}\":{\"username\":\"${HARBOR_USERNAME}\",\"password\":\"${HARBOR_PASSWORD}\"}}}" > /kaniko/.docker/config.json
  script:
    - chmod +x devops/prepare.sh && ./devops/prepare.sh
  artifacts:
    paths:
      - $TIMESTAMP
      - $TAGS
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"

build-manual:
  when: manual
  dependencies:
    - prepare
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  tags:
    - ivfhq
  stage: build
  interruptible: true
  cache: {}
  before_script:
    - echo "Building ..."
    - path=$(pwd)
    - export CI_PIPELINE_CREATED_AT=$(date +%d%m%Y%H%M)
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${HARBOR_REPO}\":{\"username\":\"${HARBOR_USERNAME}\",\"password\":\"${HARBOR_PASSWORD}\"}}}" > /kaniko/.docker/config.json
  script:
    - chmod +x devops/prepare.sh && ./devops/prepare.sh
    - echo $CI_PIPELINE_CREATED_AT > $TIMESTAMP
  artifacts:
    paths:
      - $TIMESTAMP
      - $TAGS
  rules:
    - if: $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "dev"

compile_dynamic:
  stage: build
  dependencies:
    - prepare
  image:
    name: rust:${RUST_VERSION}
  tags:
    - ivfhq
  interruptible: true
  cache: {}
  before_script:
    - echo "Building ..."
    - path=$(pwd)
    - apt update && apt upgrade -y && apt install -y clang lld build-essential gpg sudo wget lsb-release
    - wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-archive-keyring.gpg
    - echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
    - apt update && apt install -y postgresql-client
  script:
    - cargo fetch --locked
    - cargo build --locked --release --target-dir ./target
    - cp target/release/$APP_NAME $CI_PROJECT_DIR
    - echo "JOB_ID_DYNAMIC=$CI_JOB_ID" > variables.env && echo "RELEASE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)" >> variables.env
  after_script:
    - cat variables.env # Debug: Check the content of job.env
  artifacts:
    paths:
      - $APP_NAME
    expire_in: 1 year
    reports:
      dotenv: variables.env # Specify the path to the job.env file
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"

compile_static:
  stage: build
  dependencies:
    - prepare
  image:
    name: rust:${RUST_VERSION}-alpine
  tags:
    - ivfhq
  interruptible: true
  cache: {}
  before_script:
    - echo "Building ..."
    - path=$(pwd)
    - apk update && apk upgrade --no-cache && apk add --no-cache build-base clang lld musl-dev git file pkgconfig openssl-dev libcrypto3 libssl3 openssl-libs-static postgresql16-client
  script:
    - cargo fetch --locked
    - cargo build --locked --release --target-dir ./target
    - cp target/release/${APP_NAME} $CI_PROJECT_DIR/${APP_NAME}-static
    - echo "JOB_ID_STATIC=$CI_JOB_ID" > variables.env
  after_script:
    - cat variables.env # Debug: Check the content of job.env
  artifacts:
    paths:
      - ${APP_NAME}-static
    expire_in: 1 year
    reports:
      dotenv: variables.env # Specify the path to the job.env file
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"

make_deb_files:
  stage: deb
  needs:
    - job: compile_dynamic
      artifacts: true
    - job: compile_static
      artifacts: true
  image:
    name: ubuntu:24.04
  tags:
    - ivfhq
  interruptible: true
  cache: {}
  before_script:
    - echo "Creating deb files ..."
    - echo "JOB_ID_DYNAMIC=$JOB_ID_DYNAMIC JOB_ID_STATIC=$JOB_ID_STATIC"
    - apt update && apt upgrade -y && apt install -y build-essential devscripts curl
    - curl https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc && chmod +x /usr/local/bin/mc
  script:
    - 'sed -i "s/\(Version: \)[0-9]\+\.[0-9]\+\.[0-9]\+\(-static\.[0-9]\+\)/\1${RELEASE_VERSION}\2/" debian/static/DEBIAN/control'
    - 'sed -i "s/\(Version: \)[0-9]\+\.[0-9]\+\.[0-9]\+\(-[0-9]\+\)/\1${RELEASE_VERSION}\2/" debian/dynamic/DEBIAN/control'
    - cp $CI_PROJECT_DIR/$APP_NAME $CI_PROJECT_DIR/debian/dynamic/usr/local/bin/$APP_NAME && rm $CI_PROJECT_DIR/debian/dynamic/usr/local/bin/.gitkeep
    - cp $CI_PROJECT_DIR/${APP_NAME}-static $CI_PROJECT_DIR/debian/static/usr/local/bin/${APP_NAME} && rm $CI_PROJECT_DIR/debian/static/usr/local/bin/.gitkeep
    - chmod -R 755 debian/
    - dpkg-deb --build debian/dynamic $CI_PROJECT_DIR/${APP_NAME}_${RELEASE_VERSION}_amd64.deb
    - dpkg-deb --build debian/static $CI_PROJECT_DIR/${APP_NAME}-static_${RELEASE_VERSION}_amd64.deb
    - mc ls -r ivf/$MINIO_BUCKET
    - mc cp ivf/$MINIO_BUCKET/versions.txt ./versions.txt
    - echo -e "${RELEASE_VERSION}/${APP_NAME}_${RELEASE_VERSION}_amd64.deb\n${RELEASE_VERSION}/${APP_NAME}-static_${RELEASE_VERSION}_amd64.deb\n${RELEASE_VERSION}/${APP_NAME}\n${RELEASE_VERSION}/${APP_NAME}-static" >> versions.txt
    - mc cp versions.txt ivf/$MINIO_BUCKET
    - mc cp ${APP_NAME}_${RELEASE_VERSION}_amd64.deb ivf/$MINIO_BUCKET/${RELEASE_VERSION}/${APP_NAME}_${RELEASE_VERSION}_amd64.deb
    - mc cp ${APP_NAME}-static_${RELEASE_VERSION}_amd64.deb ivf/$MINIO_BUCKET/${RELEASE_VERSION}/${APP_NAME}-static_${RELEASE_VERSION}_amd64.deb
    - mc cp ${APP_NAME} ivf/$MINIO_BUCKET/${RELEASE_VERSION}/$APP_NAME
    - mc cp ${APP_NAME}-static ivf/$MINIO_BUCKET/${RELEASE_VERSION}/${APP_NAME}-static
    - echo "$RELEASE_VERSION" > latest.txt
    - mc cp latest.txt ivf/$MINIO_BUCKET/latest.txt
    - echo "JOB_ID_DEB=$CI_JOB_ID" > variables.env
  after_script:
    - cat variables.env # Debug: Check the content of job.env
  artifacts:
    paths:
      - ${APP_NAME}_${RELEASE_VERSION}_amd64.deb
      - ${APP_NAME}-static_${RELEASE_VERSION}_amd64.deb
    expire_in: 1 year
    reports:
      dotenv: variables.env # Specify the path to the job.env file
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: compile_dynamic
      artifacts: true
    - job: compile_static
      artifacts: true
    - job: make_deb_files
      artifacts: true
  tags:
    - ivfhq
  interruptible: true
  cache: {}
  before_script:
    - echo "Releasing ..."
  script:
    - echo $RELEASE_VERSION
    - echo $JOB_ID_DYNAMIC
    - echo $JOB_ID_STATIC
    - echo $JOB_ID_DEB
    - echo $MINIO_URL
  release:
    name: "Release v${RELEASE_VERSION}"
    tag_name: "v${RELEASE_VERSION}"
    description: "Release created using the release-cli. Release 'v${RELEASE_VERSION}'" # Use double quotes for variable interpolation
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "$APP_NAME"
          url: "$MINIO_URL/$MINIO_BUCKET/${RELEASE_VERSION}/${APP_NAME}"
        - name: "${APP_NAME}-static"
          url: "$MINIO_URL/$MINIO_BUCKET/${RELEASE_VERSION}/${APP_NAME}-static"
        - name: "${APP_NAME}_${RELEASE_VERSION}_amd64.deb"
          url: "$MINIO_URL/$MINIO_BUCKET/${RELEASE_VERSION}/${APP_NAME}_${RELEASE_VERSION}_amd64.deb"
        - name: "${APP_NAME}-static_${RELEASE_VERSION}_amd64.deb"
          url: "$MINIO_URL/$MINIO_BUCKET/${RELEASE_VERSION}/${APP_NAME}-static_${RELEASE_VERSION}_amd64.deb"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
