[package]
name = "postgres-db-actions"
version = "1.5.1"
edition = "2021"
authors = [
    'Cristian Iordachescu <53430981+CristiCriss17G@users.noreply.github.com>',
]
license = "AGPL-3.0-only"
rust-version = "1.96"

[profile.release]
debug = false     # This strips the debug information
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = 3     # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[[bin]]
name = "pg_actions"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = [
    "derive",
    "env",
    "cargo",
    "unicode",
    "wrap_help",
] }
clap_complete = "4.6.5"
colored = { version = "3.1.1", features = ["no-color"] }
csv = "1.4.0"
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
dirs = "6.0.0"
fern = { version = "0.7.1", features = ["colored"] }
log = "0.4.32"
native-tls = "0.2.18"
nucleo-matcher = "0.3.1"
postgres-native-tls = "0.5.3"
prettytable-rs = "0.10.0"
rand = "0.10.1"
rpassword = "7.5.4"
rusoto_core = "0.48.0"
rusoto_credential = "0.48.0"
rusoto_s3 = "0.48.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4.46"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-postgres = "0.7.13"
walkdir = "2.5.0"
xz2 = { version = "0.1.7", features = ["tokio"] }
