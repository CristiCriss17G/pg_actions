[package]
name = "postgres-db-actions"
version = "1.2.0"
edition = "2021"
authors = ['Cristian Iordachescu <cristian.iordachescu@ivfuture.uk>']
rust-version = "1.78"

[profile.release]
debug = false # This strips the debug information
lto = true
opt-level = 3 # Optimize for minimal binary size

[[bin]]
name = "pg_actions"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.38"
clap = { version = "4.5.7", features = ["derive", "env"] }
clap_complete = "4.5.6"
colored = "2.1.0"
csv = "1.3.0"
dirs-next = "2.0.0"
env_logger = "0.11.3"
log = "0.4.21"
native-tls = "0.2.12"
postgres-native-tls = "0.5.0"
prettytable-rs = "0.10.0"
rand = "0.8.5"
rpassword = "7.3.1"
rusoto_core = "0.48.0"
rusoto_credential = "0.48.0"
rusoto_s3 = "0.48.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.118"
tar = "0.4.41"
thiserror = "1.0.61"
tokio = { version = "1.38.0", features = ["full"] }
tokio-postgres = "0.7.10"
walkdir = "2.5.0"
xz2 = { version = "0.1.7", features = ["tokio"] }
