[package]
name = "postgres-db-actions"
version = "1.5.0"
edition = "2021"
authors = ['Cristian Iordachescu <cristian.iordachescu@ivfuture.uk>']
rust-version = "1.85"

[profile.release]
debug = false # This strips the debug information
lto = true
opt-level = 3 # Optimize for minimal binary size

[[bin]]
name = "pg_actions"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.40"
clap = { version = "4.5.34", features = [
    "derive",
    "env",
    "cargo",
    "unicode",
    "wrap_help",
] }
clap_complete = "4.5.47"
colored = { version = "3.0.0", features = ["no-color"] }
csv = "1.3.1"
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
dirs = "6.0.0"
fern = { version = "0.7.1", features = ["colored"] }
log = "0.4.27"
native-tls = "0.2.14"
nucleo-matcher = "0.3.1"
postgres-native-tls = "0.5.1"
prettytable-rs = "0.10.0"
rand = "0.9.0"
rpassword = "7.3.1"
rusoto_core = "0.48.0"
rusoto_credential = "0.48.0"
rusoto_s3 = "0.48.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4.46"
thiserror = "2.0"
tokio = { version = "1.44.1", features = ["full"] }
tokio-postgres = "0.7.13"
walkdir = "2.5.0"
xz2 = { version = "0.1.7", features = ["tokio"] }
