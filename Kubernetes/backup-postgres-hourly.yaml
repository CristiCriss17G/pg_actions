apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres-hourly
  namespace: database-backup
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          containers:
            - env:
                - name: S3_PREFIX
                  value: postgres-dev/hourly
              envFrom:
                - secretRef:
                    name: database-backup-secret-postgres-dev
              args: ["backup", "all", "-v"]
              image: regcr.ivfuture.uk/devops-services/tools/postgres-db-actions:latest
              imagePullPolicy: Always
              name: backup-mongo
              resources: {}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          imagePullSecrets:
            - name: harbor-ivfuk
          restartPolicy: OnFailure
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  schedule: 0 */1 * * *
  successfulJobsHistoryLimit: 3
  suspend: false
